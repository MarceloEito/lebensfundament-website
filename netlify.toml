# Netlify reads these settings when the GitHub repository is connected.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Vite 8 needs Node.js 20.19+ or 22.12+
  NODE_VERSION = "22"

# Security headers for every page. The main Content-Security-Policy is a
# <meta> tag added by vite.config.js; frame-ancestors only works as a header.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Built JS/CSS files have a content hash in their name and never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
