<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ab4d13" />
    <meta name="description" content="Kirche Lebensfundament in Bruchmühlbach-Miesau. Gottesdienst jeden Sonntag um 11 Uhr – komm wie du bist, wir freuen uns auf dich!" />
    <title>Lebensfundament - Bruchmühlbach-Miesau</title>

    <!-- Link preview for WhatsApp, Signal, Facebook, LinkedIn, X … -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Kirche Lebensfundament" />
    <meta property="og:title" content="Kirche Lebensfundament – Bruchmühlbach-Miesau" />
    <meta property="og:description" content="Gottesdienst jeden Sonntag um 11 Uhr. Komm wie du bist – wir freuen uns auf dich!" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lobpreis im Gottesdienst mit dem Logo der Kirche Lebensfundament" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>Sie müssen JavaScript aktivieren, um diese App auszuführen.</noscript>
    <div id="root"></div>

    <!--
      Netlify Forms: static copies of the React forms so Netlify detects
      them when the site is deployed. Keep form and field names in sync
      with ContactForm.jsx and FeedbackWidget.jsx.
    -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="email" />
      <input name="betreff" />
      <textarea name="nachricht"></textarea>
      <input name="subject" />
      <input name="bot-field" />
    </form>
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bereich" />
      <textarea name="feedback"></textarea>
      <input name="geraet" />
      <input name="seite" />
      <input name="subject" />
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
