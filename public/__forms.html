<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formulare</title>
  </head>
  <body>
    <!--
      Netlify Forms: static copies of the React forms. Netlify reads this
      file when the site is deployed to register the forms, and the React
      forms send their data here (src/forms.js). Keep form and field names
      in sync with ContactForm.jsx and FeedbackWidget.jsx.
    -->
    <form name="kontakt" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="kontakt" />
      <input name="name" />
      <input name="email" />
      <input name="betreff" />
      <textarea name="nachricht"></textarea>
      <input name="subject" />
      <input name="bot-field" />
    </form>
    <form name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="feedback" />
      <input name="bereich" />
      <textarea name="feedback"></textarea>
      <input name="geraet" />
      <input name="seite" />
      <input name="subject" />
      <input name="bot-field" />
    </form>
  </body>
</html>
