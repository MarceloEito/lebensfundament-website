# Builds the website and uploads it to the webspace at all-inkl on every
# change to main, including flyers saved in /admin. The FTP access data are
# repository secrets (Settings → Secrets and variables → Actions):
# FTP_SERVER (e.g. w0123456.kasserver.com), FTP_USERNAME, FTP_PASSWORD and,
# when the FTP login sees the whole webspace, FTP_DIR: the domain's folder
# as shown in the KAS (e.g. /lebensfundament.org/).
name: Deploy to all-inkl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time; a newer change waits for the running one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://lebensfundament.org
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload to all-inkl
        if: env.FTP_SERVER != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lftp
          DIR="${FTP_DIR%/}"
          DIR="${DIR:-.}"
          # Encrypted FTP (TLS). New JS/CSS files go up first, so a visitor
          # never gets a page whose files are still missing, then everything
          # else. Old files are only removed inside the site's own asset and
          # upload folders, never elsewhere in the webspace.
          lftp -c "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set net:max-retries 3
            open --user '$FTP_USERNAME' --env-password '$FTP_SERVER'
            mirror --reverse --parallel=4 --verbose build/assets/ '$DIR/assets/'
            mirror --reverse --parallel=4 --verbose --exclude-glob .well-known/ build/ '$DIR/'
            mirror --reverse --delete --parallel=4 --verbose build/assets/ '$DIR/assets/'
            mirror --reverse --delete --parallel=4 --verbose build/uploads/ '$DIR/uploads/'
          "

      - name: No upload without access data
        if: env.FTP_SERVER == ''
        run: echo "::warning::The secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD are not set yet, so nothing was uploaded."
